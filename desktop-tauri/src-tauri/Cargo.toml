[package]
name = "capturedesk-desktop"
version = "2.0.0-alpha.1"
description = "CaptureDesk Desktop — local-first screen recording (Tauri + native engine)"
edition = "2021"
rust-version = "1.77"
authors = ["CaptureDesk contributors"]
license = "MIT"

[lib]
name = "capturedesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Named binary so `tauri build --no-bundle` emits CaptureDesk.exe directly
# (matching productName); the Tauri bundler renames to productName anyway.
[[bin]]
name = "CaptureDesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
chrono = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
