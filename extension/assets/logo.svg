<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="CaptureDesk">
  <defs>
    <linearGradient id="cd-badge-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#086E96"/>
    </linearGradient>
  </defs>
  <!-- teal gradient rounded square badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#cd-badge-gradient)"/>
  <!-- white monitor frame -->
