<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CaptureDesk</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <svg class="logo" width="24" height="24" viewBox="0 0 128 128" role="img" aria-label="CaptureDesk">
        <defs>
          <linearGradient id="cd-popup-logo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#14B8A6"/>
            <stop offset="1" stop-color="#086E96"/>
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#cd-popup-logo)"/>
        <rect x="30" y="40" width="68" height="46" rx="8" fill="none" stroke="#FFFFFF" stroke-width="7"/>
        <path d="M64 86v10M48 100h32" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
        <circle cx="101" cy="38" r="15" fill="#FFFFFF"/>
        <circle cx="101" cy="38" r="7.5" fill="#EF4444"/>
      </svg>
      <h1 class="title">CaptureDesk</h1>
      <span class="chip" id="versionChip">v1.0.0</span>
      <button id="openOptions" class="icon-btn" type="button" title="CaptureDesk Settings" aria-label="CaptureDesk Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.25"/>
          <path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/>
        </svg>
      </button>
    </header>

    <p id="statusLine" class="status" hidden></p>

    <section id="setupView" class="view" aria-label="Recording setup">
      <div class="seg" id="modeSeg" role="group" aria-label="Capture mode">
        <button type="button" class="seg-btn is-active" data-mode="tab">Tab</button>
        <button type="button" class="seg-btn" data-mode="window">Window</button>
        <button type="button" class="seg-btn" data-mode="screen">Screen</button>
      </div>

      <div class="card">
        <label class="switch-row">
          <span>Microphone</span>
          <span class="switch">
            <input type="checkbox" id="optMic" checked />
            <span class="knob"></span>
          </span>
        </label>
        <label class="switch-row">
          <span>Camera bubble</span>
          <span class="switch">
            <input type="checkbox" id="optCam" />
            <span class="knob"></span>
          </span>
        </label>
        <label class="switch-row">
          <span>Cursor highlight</span>
          <span class="switch">
            <input type="checkbox" id="optCursor" checked />
            <span class="knob"></span>
          </span>
        </label>
        <label class="switch-row">
          <span>Click highlights</span>
          <span class="switch">
            <input type="checkbox" id="optClicks" checked />
            <span class="knob"></span>
          </span>
        </label>
      </div>

      <div class="row">
        <label class="field">
          <span>Quality</span>
          <select id="optQuality">
            <option value="720p">720p</option>
            <option value="1080p">1080p</option>
          </select>
        </label>
        <label class="field">
          <span>Countdown</span>
          <select id="optCountdown">
            <option value="0">Off</option>
            <option value="3">3s</option>
            <option value="5">5s</option>
          </select>
        </label>
      </div>

      <button id="startBtn" class="btn-primary" type="button">Start Recording</button>
    </section>

    <section id="recView" class="view" hidden aria-label="Recording in progress">
      <div class="timer-row">
        <span class="rec-dot" id="recDot"></span>
        <span class="timer" id="timer">0:00</span>
        <span class="pill pill-paused" id="pausedPill" hidden>Paused</span>
        <span class="pill pill-count" id="countPill" hidden>Starting in 3s</span>
      </div>
      <div class="btn-row">
        <button id="pauseBtn" class="btn-secondary" type="button">Pause</button>
        <button id="stopBtn" class="btn-primary" type="button">Stop &amp; save</button>
      </div>
      <button id="cancelBtn" class="btn-ghost" type="button">Cancel</button>
    </section>

    <section id="savedCard" class="card saved" hidden>
      <p class="saved-title">Saved to your Recordings folder</p>
      <p class="saved-name" id="savedName"></p>
    </section>

    <footer class="footer">
      <span class="muted" id="footerFolder">Saved to Downloads/CaptureDesk</span>
      <span class="muted hint" id="openDesktop" title="Included with CaptureDesk Desktop">Open CaptureDesk Desktop</span>
    </footer>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
