name: CaptureDesk CI (v2 native stack)

on:
  push:
    branches: [main, v2-native]
  pull_request:
    branches: [main]

jobs:
  ui:
    name: UI & extension (JS/JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check all JavaScript
        run: |
          find desktop-tauri/ui extension -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate JSON
        run: |
          node -e '
            const fs = require("fs");
            const files = ["extension/manifest.json",
              "desktop-tauri/src-tauri/tauri.conf.json",
              "desktop-tauri/src-tauri/capabilities/default.json"];
            for (const f of files) JSON.parse(fs.readFileSync(f, "utf8"));
            console.log("JSON OK");
          '

  rust-shell:
    name: Shell (Tauri 2 / Rust)
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - name: cargo check
        working-directory: desktop-tauri/src-tauri
        run: cargo check --all-targets

  engine:
    name: Engine (C++17)
    strategy:
      matrix:
        include:
          - os: ubuntu-latest    # transcode/export path
          - os: windows-latest   # full capture path (WGC/WASAPI/MF)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install engine deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev libavformat-dev libavcodec-dev \
            libavutil-dev libswscale-dev libswresample-dev pkg-config cmake g++
      - name: Install engine deps (Windows, vcpkg)
        if: runner.os == 'Windows'
        run: |
          vcpkg install nlohmann-json ffmpeg[x264,vpx,opus] --triplet x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
        # Binary-cache vcpkg builds (same source as release.yml): restores
        # ffmpeg/x264 from the Actions cache instead of re-downloading
        # upstream tarballs (code.videolan.org has flaked before).
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
          GITHUB_TOKEN: ${{ github.token }}
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S desktop-tauri/native -B desktop-tauri/native/build -DCMAKE_BUILD_TYPE=Release -DCAPTUREDESK_BUILD_TESTS=ON
      - name: Configure (Windows, vcpkg toolchain)
        if: runner.os == 'Windows'
        run: |
          cmake -S desktop-tauri/native -B desktop-tauri/native/build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build desktop-tauri/native/build --config Release --parallel
      - name: Encode tests (WebM/MP4/GIF)
        if: runner.os == 'Linux'
        run: |
          set -e
          ./desktop-tauri/native/build/capturedesk-encode-test /tmp/cd-ci-test.webm
          ./desktop-tauri/native/build/capturedesk-encode-test /tmp/cd-ci-test.mp4
          ./desktop-tauri/native/build/capturedesk-encode-test /tmp/cd-ci-test.gif
          test -s /tmp/cd-ci-test.webm
          test -s /tmp/cd-ci-test.mp4
          test -s /tmp/cd-ci-test.gif
          echo "encode pipeline OK"

  host:
    name: Native host (C# / .NET 8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build & publish
        run: dotnet publish native-host-cs/capturedesk-native-host.csproj -c Release -r win-x64 -o native-host-cs/publish
      - name: Smoke (protocol ping)
        shell: pwsh
        run: |
          # 4-byte LE length + JSON body → expect a pong JSON back
          $json = '{"type":"ping"}'
          $bytes = [Text.Encoding]::UTF8.GetBytes($json)
          $ms = New-Object IO.MemoryStream
          $ms.Write([BitConverter]::GetBytes([uint32]$bytes.Length), 0, 4)
          $ms.Write($bytes, 0, $bytes.Length)
          $out = $ms.ToArray() | & native-host-cs/publish/capturedesk-native-host.exe
          if ("$out" -notmatch 'pong') { throw "host smoke failed: $out" }
          Write-Host "host smoke OK: $out"
